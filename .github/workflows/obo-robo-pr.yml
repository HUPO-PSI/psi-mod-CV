name: obo-robo-pr

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'PSI-MOD.obo'
      - '.github/binaries/*'

permissions: 
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:    
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Checkout PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr checkout ${{ github.event.pull_request.number }}

    - name: Get changed lines
      id: detect_changes
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        lines="$(git diff --unified=0 --no-color --no-prefix -r "$base" HEAD -- PSI-MOD.obo | grep -oP '^@@ -\d+(,\d+)? \+\K\d+' | paste -sd, -)"
        echo "changed_lines=${lines}" >> "$GITHUB_OUTPUT"
        echo "Changed lines: ${lines}" 

    - name: Lint main OBO file
      id: lint
      run: |
        echo "result=$(./.github/binaries/obo-robo lint PSI-MOD.obo --changed-line-numbers '${{ steps.detect_changes.outputs.changed_lines }}' --gh-pr)" >> $GITHUB_OUTPUT

    - name: Fix & format OBO file
      id: fix
      run: |
        echo "result=$(./.github/binaries/obo-robo fix PSI-MOD.obo --changed-line-numbers '${{ steps.detect_changes.outputs.changed_lines }}' --gh-pr)" >> $GITHUB_OUTPUT

    - name: Check for Changes
      id: check_changes
      run: echo "has_changes=$(if [ -n "$(git status --porcelain)" ]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT

    - name: Push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      env:
        PAT: ${{ secrets.PAT }}
      run: |
        git --no-pager diff
        if [ -z "$PAT" ]; then
          echo "obo-robo changed PSI-MOD.obo, but this pull request has no PAT so the formatting cannot be pushed."
          exit 1
        fi
        git config --global user.name 'OboRobo'
        git config --global user.email 'oborobo@users.noreply.github.com'
        git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}"
        git commit -am "Fix & format"
        git push

    - name: Comment
      env:
        GH_TOKEN: ${{ github.token }}
        LINT_RESULT: ${{ steps.lint.outputs.result }}
        FIX_RESULT: ${{ steps.fix.outputs.result }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        {
          printf '%s' "$LINT_RESULT"
          printf '%s' "$FIX_RESULT"
        } > /tmp/obo-robo-comment.txt
        if [ ! -s /tmp/obo-robo-comment.txt ]; then
          echo "obo-robo did not return a comment."
          exit 0
        fi
        if gh pr comment "${{ github.event.number }}" --body-file /tmp/obo-robo-comment.txt; then
          exit 0
        fi
        echo "Could not comment on the pull request."
        cat /tmp/obo-robo-comment.txt
        if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "Fork pull requests receive a read-only token, so the comment is skipped."
          exit 0
        fi
        exit 1

